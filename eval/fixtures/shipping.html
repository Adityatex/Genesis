<!doctype html>
<html><head><title>Shipping details</title></head>
<body>
  <h1>Shipping details</h1>
  <form action="/api/shipping" method="post">
    <p><label for="country">Country</label>
      <select id="country" name="country" aria-label="Country">
        <option value="">Choose a country</option>
        <option value="DE">Germany</option>
        <option value="IN">India</option>
        <option value="JP">Japan</option>
        <option value="US">United States</option>
      </select></p>
    <p><label for="speed">Shipping speed</label>
      <select id="speed" name="speed" aria-label="Shipping speed">
        <option value="standard">Standard (5-7 days)</option>
        <option value="express">Express (1-2 days)</option>
      </select></p>
    <p><button type="submit">Continue to payment</button></p>
  </form>
</body></html>
