<!doctype html>
<html><head><title>Nimbus 14 - Byte Store</title></head>
<body>
  <p><a href="/laptops/index.html">All laptops</a></p>
  <h1>Nimbus 14</h1>
  <table>
    <tr><th>Price</th><td>$1,099</td></tr>
    <tr><th>Memory (RAM)</th><td>16 GB</td></tr>
    <tr><th>Storage</th><td>512 GB SSD</td></tr>
    <tr><th>Screen</th><td>14"</td></tr>
  </table>
  <button id="add">Add to cart</button>
  <p id="status" role="status"></p>
  <script>
    document.getElementById('add').addEventListener('click', async () => {
      await fetch('/api/cart', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ item: 'nimbus-14' }) });
      document.getElementById('status').textContent = 'Nimbus 14 added to your cart.';
    });
  </script>
</body></html>
