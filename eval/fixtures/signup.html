<!doctype html>
<html><head><title>Create your account</title></head>
<body>
  <h1>Create your account</h1>
  <form action="/api/signup" method="post">
    <p><label for="name">Full name</label> <input id="name" name="name" type="text"></p>
    <p><label for="email">Email</label> <input id="email" name="email" type="email"></p>
    <p><label><input name="terms" type="checkbox" aria-label="I agree to the terms of service"> I agree to the terms of service</label></p>
    <p><button type="submit">Create account</button></p>
  </form>
</body></html>
