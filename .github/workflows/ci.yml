name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: genesis-chrome-mv3
          path: .output/chrome-mv3

  eval-mock:
    # End-to-end: real extension in real Chromium, scripted planner (no API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Mock eval
        run: npm run eval:mock -- --timeout 45

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-mock-results
          path: eval/results
