name: Live eval

# Runs the benchmark against a real LLM provider. Manual only: it costs API
# calls and results vary run to run. Needs the provider's key as a repository
# secret: GROQ_API_KEY, DEEPSEEK_API_KEY, OPENAI_API_KEY or OPENROUTER_API_KEY.
on:
  workflow_dispatch:
    inputs:
      trials:
        description: Trials per task
        default: '3'
      tasks:
        description: Comma-separated task ids (blank = all)
        default: ''
      provider:
        description: Provider (groq, deepseek, openai, openrouter)
        default: groq
      model:
        description: Model id (blank = provider default; required for providers without one)
        default: ''

jobs:
  eval-live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Live eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          TRIALS: ${{ inputs.trials }}
          TASKS: ${{ inputs.tasks }}
          MODEL: ${{ inputs.model }}
        run: npm run eval -- --provider "$PROVIDER" --trials "$TRIALS" ${TASKS:+--task "$TASKS"} ${MODEL:+--model "$MODEL"}

      - name: Job summary
        if: always()
        run: cat eval/results/latest-live.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-live-results
          path: eval/results
